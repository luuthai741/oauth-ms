spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**,/.well-known/**
            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders/**

server:
  port: 8080


