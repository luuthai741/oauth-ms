spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:3000"
                  - "http://localhost:5173"
                  - "http://localhost:5174"
                  - "http://127.0.0.1:3000"
                  - "http://127.0.0.1:5173"
                  - "http://127.0.0.1:5174"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "Content-Type"
                  - "Authorization"
                  - "X-Requested-With"
                  - "Accept"
                  - "Origin"
                allowCredentials: false
                maxAge: 3600
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**,/.well-known/**
            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/orders/**

server:
  port: 8080


