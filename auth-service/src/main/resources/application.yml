spring:
  application:
    name: auth-service
  main:
    web-application-type: servlet
server:
  port: 8081
  servlet:
    context-path: /

auth:
  external:
    base-url: http://localhost:8080
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

jwt:
  issuer: http://localhost:8081
  expiration-seconds: 3600